# Produccion: se usa junto con docker-compose.yml
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  web:
    ports: !reset []          # Nginx ya no se expone directo; lo atiende Caddy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO}     # solo el dominio; Caddy no recibe ninguna clave
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
