server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 6m;   # hojas de vida hasta 5 MB
    server_tokens off;

    # API -> contenedor FastAPI
    location /api/ {
        include /etc/nginx/seguridad.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # el analisis del CV con IA puede tardar
    }

    # Archivos con hash: cache larga
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        include /etc/nginx/seguridad.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aplicacion Angular (rutas del lado del cliente)
    location / {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
