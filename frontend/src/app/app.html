@if (demo) {
  <div class="demo">Modo demostración · datos de ejemplo, nada se guarda</div>
}
@if (sesion.activa()) {
  <header class="barra">
    <div class="contenedor barra-interior">
      <a routerLink="/" class="marca">Proyecto Empleo</a>
      <nav>
        <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Vacantes</a>
      </nav>
      <div class="usuario">
        <a routerLink="/perfil" routerLinkActive="activo" class="perfil" title="Mi perfil">
          <span class="avatar" aria-hidden="true">{{ iniciales() }}</span>
          <span class="nombre">{{ sesion.nombre() }}</span>
        </a>
        <button class="tenue" (click)="sesion.cerrar()">Salir</button>
      </div>
    </div>
  </header>
  <main class="contenedor contenido"><router-outlet /></main>
} @else {
  <router-outlet />
}
