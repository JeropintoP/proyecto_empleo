# Corre las pruebas del backend y compila el frontend en cada push y pull request.
# Gratis en repositorios publicos. Resultado: pestana "Actions" del repositorio en GitHub.
name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: empleo
          POSTGRES_PASSWORD: empleo
          POSTGRES_DB: pruebas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U empleo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://empleo:empleo@localhost:5432/pruebas
      JWT_SECRETO: solo-para-las-pruebas-de-github-actions-0123456789
      PGPASSWORD: empleo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Esquema de la base de datos (todas las migraciones, dos veces para probar que son idempotentes)
        run: |
          for vez in 1 2; do
            for f in db/init/*.sql; do psql -h localhost -U empleo -d pruebas -v ON_ERROR_STOP=1 -q -f "$f"; done
          done
      - run: pip install -r backend/requirements.txt
      - name: Pruebas
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
